# India Nifty-200 RSI alerts after NSE cash close (once per weekday).
# Sends daily RSI and weekly RSI digests (both RSI ≤ threshold).
# Separate from the intraday OI + RSI scanner.
in_rsi:
  enabled: true
  rsi_period: 14
  rsi_threshold: 32
  history_days: 120
  watchlist_path: data/nifty200.txt
  yahoo_suffix: ".NS"
  market_label: "India Nifty-200"
  currency_symbol: "₹"
  weekly_enabled: true
