# RSI settings
rsi:
  period: 14
  call_threshold: 70      # Notify when RSI is at or above this
  put_threshold: 35       # Notify when RSI is at or below this

# How close price must be to the max OI strike (percentage)
oi:
  proximity_pct: 2.0      # e.g. 2% means price within 2% of the strike

# Live data from Angel One SmartAPI
data:
  history_days: 120       # Daily candles pulled for the RSI calculation

# Stocks to scan: "all" covers every NSE stock with listed options,
# or replace it with an explicit list of symbols, e.g.
#   watchlist:
#     - RELIANCE
#     - HDFCBANK
watchlist: all

# Scanner schedule (24h format, IST assumed). Weekdays only.
schedule:
  interval_minutes: 30
  market_start: "09:15"
  market_end: "15:45"

# Notification settings
notifications:
  console: true
  telegram: true          # Used only when the bot token and chat ID are set
  cooldown_minutes: 30    # Matches the scan interval, so a stock that still
                          # qualifies is re-alerted once per scan. Raise it to
                          # hear about each stock less often.
