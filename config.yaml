# RSI settings
rsi:
  period: 14
  call_threshold: 70      # Notify when RSI is at or above this
  put_threshold: 31       # Notify when RSI is at or below this

# How close price must be to the max OI strike (percentage)
oi:
  proximity_pct: 1.0      # e.g. 1% means price within 1% of the strike
  s2_proximity_pct: 0.5   # S2 only: tighter entry than RSI+OI / S1
  s2_pcr_strikes: 1       # S2 ΔPCR: 1 listed strike below + wall + 1 above
  s2_min_wall_contracts: 100   # S2: standing OI at the wall, in lots
  s2_min_write_contracts: 20   # S2: session writing at the wall, in lots
  skip_monthly_expiry: true    # All scanners: no new entries on last-Tuesday expiry
  # CALL shorts: require ΔPCR < 0.75.
  require_call_writing: true
  max_change_pcr: 0.75
  # PUT longs: require ΔPCR > 1.0.
  require_put_writing: true
  min_change_pcr: 1.0
  # S1: if the peak is already through price, the next uncrossed wall is used
  # only when its OI is at least this % of the peak. Thin leftovers are skipped.
  # On NSE monthly expiry (last Tuesday) OI rolls to next month
  # so front-month unwind is not read as a signal. BSE Thursday is ignored.

# Supertrend + OI at the Supertrend strike (intraday F&O scan).
# Price below ST and within proximity → bearish ΔOI → short 3rd-month futures.
# Price above ST and within proximity → bullish ΔOI → long 3rd-month futures.
supertrend:
  enabled: true
  atr_period: 20
  multiplier: 4.5
  proximity_pct: 0.5

# Live data from Angel One SmartAPI
data:
  history_days: 400       # Daily candles for RSI + Supertrend (Angel One)

# Stocks to scan: "all" covers every NSE stock with listed options,
# or replace it with an explicit list of symbols, e.g.
#   watchlist:
#     - RELIANCE
#     - HDFCBANK
watchlist: all

# Never short laboratory names (CDMO / research labs / diagnostic labs).
# Applies to RSI+OI, S1, S2, and Supertrend. Longs still open if Put /
# bullish Supertrend rules pass. Pharma (LUPIN, SUNPHARMA, CIPLA,
# DRREDDY, BIOCON, ALKEM, GLENMARK, TORNTPHARM, ZYDUSLIFE, MANKIND…)
# is not on this list and can still be shorted.
no_short_symbols:
  - DIVISLAB      # Divi's Laboratories
  - LAURUSLABS    # Laurus Labs
  - NEULANDLAB    # Neuland Laboratories
  - SYNGENE       # Syngene (research labs)
  - LALPATHLAB    # Dr Lal PathLabs
  - METROPOLIS    # Metropolis Healthcare
  - THYROCARE     # Thyrocare
  - VIJAYA        # Vijaya Diagnostic

# Scanner schedule (24h format, IST assumed). Weekdays only.
schedule:
  interval_minutes: 30
  market_start: "09:30"
  market_end: "15:45"

# Notification settings
notifications:
  console: true
  telegram: true          # Used only when the bot token and chat ID are set
  cooldown_minutes: 30    # Matches the scan interval, so a stock that still
                          # qualifies is re-alerted once per scan. Raise it to
                          # hear about each stock less often.

# Paper trading (RSI + max OI only) — separate book from Supertrend.
paper_trading:
  enabled: true
  name: "RSI+OI"
  capital: 20000000         # ₹2 crore
  lots_per_trade: 2
  first_target_pct: 6.0     # Close 1 lot after a 6% move in our favour
  second_target_pct: 11.0   # Close the remaining lot at 11% (10–12% band)
  stop_loss_pct: 4.0        # Close everything on a 4% adverse move (before first target)
  second_lot_stop_pct: 1.0  # After booking 1 lot at 6%, SL on the rest = 1% from entry
  margin_pct: 20.0          # Approximate futures margin as a % of notional
  # Paper futures month: 1 = current, 3 = far month (August → October).
# Scan uses NSE cash + current-month option OI; fills are this futures month.
  futures_month: 3
  ledger_path: data/paper_book.json     # Open positions and running P&L
  journal_csv: data/paper_trades.csv    # One row per closed trade
  # Optional: mirror closed trades into a Google Sheet. Needs a service account
  # in GOOGLE_SERVICE_ACCOUNT_JSON and the sheet shared with its email.
  google_sheet_id: "1PhX3QFeNLMMITd8glmZ3C2YfoAeRJ9wZjXOeB0hjrPY"
  google_worksheet: "RSI Paper trades"
  google_summary_worksheet: "RSI Portfolio Summary"

# RSI+OI Scenario 1: enter only on an uncrossed wall (never the peak if price
# is already through it). After entry, remaining lots close from 15:15 IST only
# if the *entry* strike is broken. 3 lots at 6% / 10% / 14%.
# Own capital, ledger, journal, and Google Sheet tab.
rsi_s1_paper_trading:
  enabled: true
  name: "RSI+OI S1"
  capital: 20000000
  lots_per_trade: 3
  first_target_pct: 6.0     # Close 1 lot after a 6% move in our favour
  second_target_pct: 10.0   # Close 1 lot after a 10% move in our favour
  third_target_pct: 14.0    # Close the remaining lot at 14%
  stop_loss_pct: 4.0        # 4% adverse (before first target)
  second_lot_stop_pct: 1.0  # After 6%, SL on remaining lots = 1% from entry
  margin_pct: 20.0
  futures_month: 3
  ledger_path: data/rsi_s1_paper_book.json
  journal_csv: data/rsi_s1_paper_trades.csv
  google_sheet_id: "1PhX3QFeNLMMITd8glmZ3C2YfoAeRJ9wZjXOeB0hjrPY"
  google_worksheet: "RSI S1 Paper trades"
  google_summary_worksheet: "RSI S1 Portfolio Summary"

# RSI+OI Scenario 2: same uncrossed-wall entry as S1, but cash must be within
# 0.5% of the strike (not 1%). ΔPCR is summed over 1 strike below the wall,
# the wall, and 1 above; writing must still be at the peak Call/Put strike.
# OI exit only after two consecutive scans both say the wall is dead
# (cash through the entry strike, or writing gone at that strike). A
# single print is ignored. 3% futures stop is a single-scan backup if
# the wall is still valid. Same 3-lot scale-out.
# Same 3-lot scale-out. Same-day re-entry after a stop is blocked.
rsi_s2_paper_trading:
  enabled: true
  name: "RSI+OI S2"
  capital: 20000000
  lots_per_trade: 3
  first_target_pct: 6.0
  second_target_pct: 10.0
  third_target_pct: 14.0
  stop_loss_pct: 3.0
  second_lot_stop_pct: 1.0
  block_same_day_reentry: true
  margin_pct: 20.0
  futures_month: 3
  ledger_path: data/rsi_s2_paper_book.json
  journal_csv: data/rsi_s2_paper_trades.csv
  google_sheet_id: "1PhX3QFeNLMMITd8glmZ3C2YfoAeRJ9wZjXOeB0hjrPY"
  google_worksheet: "RSI S2 Paper trades"
  google_summary_worksheet: "RSI S2 Portfolio Summary"

# Paper trading for Supertrend + OI only — own capital, ledger, and journal.
supertrend_paper_trading:
  enabled: true
  name: "Supertrend"
  capital: 20000000
  lots_per_trade: 2
  first_target_pct: 6.0
  second_target_pct: 11.0
  stop_loss_pct: 4.0
  second_lot_stop_pct: 1.0
  margin_pct: 20.0
  futures_month: 3
  ledger_path: data/supertrend_paper_book.json
  journal_csv: data/supertrend_paper_trades.csv
  google_sheet_id: "1PhX3QFeNLMMITd8glmZ3C2YfoAeRJ9wZjXOeB0hjrPY"
  google_worksheet: "Supertrend Paper trades"
