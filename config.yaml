# RSI + candle reversal. Do not fade RSI 70/30 on the stretch bar alone.
# Take a trade if either scenario qualifies:
#   next-day: yesterday tagged RSI 70/30 + today's reversal candle
#   same-day: from 15:15 IST, RSI tagged 70/30 today + today's bar already reversed
# Short: inverted hammer / weak middle body / strong red.
# Long: hammer / weak middle body / strong green.
# Fills are 3rd-month NSE stock futures at 15:15 IST. Cash is never the fill.
rsi:
  period: 14
  call_threshold: 70
  put_threshold: 30

candles:
  strong_body_pct: 50.0
  weak_body_pct: 40.0
  side_wick_pct: 20.0
  hammer_long_wick_pct: 50.0
  hammer_short_wick_pct: 15.0

oi:
  proximity_pct: 1.0
  skip_monthly_expiry: true
  extreme_proximity_pct: 2.0
  extreme_cooldown_days: 2
  require_call_writing: true
  max_change_pcr: 0.75
  require_put_writing: true
  min_change_pcr: 1.0

data:
  history_days: 400
  extreme_history_days: 4000

watchlist: all

# Never short laboratory names. Longs still allowed.
no_short_symbols:
  - DIVISLAB
  - LAURUSLABS
  - NEULANDLAB
  - SYNGENE
  - LALPATHLAB
  - METROPOLIS
  - THYROCARE
  - VIJAYA

schedule:
  interval_minutes: 30
  market_start: "09:30"
  market_end: "15:45"

notifications:
  console: true
  telegram: true
  cooldown_minutes: 30

# Existing live book — do not change stops on names already open.
# Candle / wider-of 2% stop. Own ledger.
rsi_candle_2w_paper_trading:
  enabled: true
  name: "RSI_CandlePattern"
  capital: 40000000
  lots_per_trade: 3
  first_target_pct: 5.0
  second_target_pct: 12.0
  smma_fast: 21
  smma_slow: 50
  second_lot_rsi_short: 30
  second_lot_rsi_long: 70
  final_lot_smma_cross_exit: true
  final_lot_no_stop: true
  stop_loss_pct: 2.0
  second_lot_stop_pct: 2.0
  candle_stop: true
  margin_pct: 20.0
  futures_month: 3
  skip_new_entries: false
  mark_entry_contract: true
  cash_close_stop: true
  loss_streak_count: 3
  loss_streak_sessions: 10
  skip_qualifies_after_streak: 3
  ledger_path: data/rsi_candle_3m_2w_paper_book.json
  journal_csv: data/rsi_candle_3m_2w_paper_trades.csv
  google_sheet_id: "1PhX3QFeNLMMITd8glmZ3C2YfoAeRJ9wZjXOeB0hjrPY"
  google_worksheet: "RSI Paper trades"
  google_summary_worksheet: "RSI Portfolio Summary"

# Final strategy: 3 lots, Rs 4 Cr, flat 1.5% stop, same RSI 70/30 screen as
# the live book. (rsi_call_threshold / rsi_put_threshold can gate this book
# at a deeper stretch without touching the live book — left unset.)
# Lot 1: 5% or SMMA 21. Lot 2: 12% or SMMA 50.
# Runner: RSI 30/70 or a strong close back through SMMA 21; no stop on the last lot.
rsi_candle_3lot_paper_trading:
  enabled: true
  name: "RSI_Candle_3Lot"
  capital: 40000000
  lots_per_trade: 3
  first_target_pct: 5.0
  second_target_pct: 12.0
  smma_fast: 21
  smma_slow: 50
  second_lot_rsi_short: 30
  second_lot_rsi_long: 70
  final_lot_smma_cross_exit: true
  final_lot_no_stop: true
  stop_loss_pct: 1.5
  second_lot_stop_pct: 1.5
  candle_stop: false
  margin_pct: 20.0
  futures_month: 3
  skip_new_entries: false
  mark_entry_contract: true
  cash_close_stop: true
  loss_streak_count: 3
  loss_streak_sessions: 10
  skip_qualifies_after_streak: 3
  ledger_path: data/rsi_candle_3lot_paper_book.json
  journal_csv: data/rsi_candle_3lot_paper_trades.csv
  google_sheet_id: "1PhX3QFeNLMMITd8glmZ3C2YfoAeRJ9wZjXOeB0hjrPY"
  google_worksheet: "RSI 3Lot Paper trades"
  google_summary_worksheet: "RSI 3Lot Portfolio Summary"
