# RSI settings
rsi:
  period: 14
  call_threshold: 70      # Notify when RSI is at or above this
  put_threshold: 35       # Notify when RSI is at or below this

# How close price must be to the max OI strike (percentage)
oi:
  proximity_pct: 2.0      # e.g. 2% means price within 2% of the strike

# Live data from Angel One SmartAPI
data:
  history_days: 120       # Daily candles pulled for the RSI calculation

# Stocks to scan: "all" covers every NSE stock with listed options,
# or replace it with an explicit list of symbols, e.g.
#   watchlist:
#     - RELIANCE
#     - HDFCBANK
watchlist: all

# Scanner schedule (24h format, IST assumed). Weekdays only.
schedule:
  interval_minutes: 30
  market_start: "09:15"
  market_end: "15:45"

# Notification settings
notifications:
  console: true
  telegram: true          # Used only when the bot token and chat ID are set
  cooldown_minutes: 30    # Matches the scan interval, so a stock that still
                          # qualifies is re-alerted once per scan. Raise it to
                          # hear about each stock less often.

# Paper trading: reversal on the signal, i.e. short into max Call OI when
# overbought, long at max Put OI when oversold.
paper_trading:
  enabled: true
  capital: 5000000          # ₹50 lakh
  lots_per_trade: 2
  first_target_pct: 6.0     # Close 1 lot after a 6% move in our favour
  second_target_pct: 15.0   # Close the remaining lot at 15%
  stop_loss_pct: 3.0        # Close everything on a 3% adverse move
  margin_pct: 20.0          # Approximate futures margin as a % of notional
  ledger_path: data/paper_book.json     # Open positions and running P&L
  journal_csv: data/paper_trades.csv    # One row per closed trade
  # Optional: mirror closed trades into a Google Sheet. Needs a service account
  # in GOOGLE_SERVICE_ACCOUNT_JSON and the sheet shared with its email.
  google_sheet_id: "1PhX3QFeNLMMITd8glmZ3C2YfoAeRJ9wZjXOeB0hjrPY"
  google_worksheet: "Paper trades"
