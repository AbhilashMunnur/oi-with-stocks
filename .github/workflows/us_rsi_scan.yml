name: US Nasdaq RSI scan

# Once per weekday after US cash equity close (4:00pm ET).
# 21:30 UTC = 5:30pm EDT / 4:30pm EST — closes are settled on Yahoo.
# Universe: Nasdaq-100 (data/nasdaq100.txt).
# Sends daily RSI ≤ 32 and weekly RSI ≤ 35.
on:
  # Schedule paused — no Telegram until the new strategy is live.
  workflow_dispatch:

concurrency:
  group: us-nasdaq-rsi-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run US daily + weekly RSI scan
        run: python -u us_rsi_main.py
