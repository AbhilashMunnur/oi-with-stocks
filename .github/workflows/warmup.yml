name: Warm market-data cache

# Prefetch daily candles before the session so the 09:30 scan does not burn
# the Angel One rate limit on a cold cache.
on:
  schedule:
    # 09:20 IST weekdays — warm candles and kick 09:30 even if this Mac is off.
    - cron: "50 3 * * 1-5"
  workflow_dispatch:

concurrency:
  group: oi-rsi-warmup
  cancel-in-progress: true

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache key for today
        id: today
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-data-${{ steps.today.outputs.date }}
          restore-keys: |
            market-data-

      - name: Warm candle cache
        run: python -u scripts/warmup_cache.py

      # GitHub's 09:20 schedule is often skipped. Kick the scan workflow so
      # its chain job waits for 09:30 even if no later cron fires.
      - name: Kick 09:30 scan chain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SCAN_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SCAN_DISPATCH_TOKEN not set — cannot kick the 09:30 chain."
            exit 0
          fi
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type='oi-halfhour-scan'
          echo "Dispatched oi-halfhour-scan so the 09:30 chain can start."
