name: OI + RSI scan

# GitHub's schedule event is often late or skipped (platform limitation).
# Mitigations stacked here:
# 1) Poll every 5 minutes + exact :00/:30 crons during the IST session
# 2) Never cancel an in-flight scan (slot guard skips duplicates instead)
# 3) Early slot guard before pip install so skip-runs finish in seconds
# 4) Warmup 10 minutes before the slot so pip/login finish by :00/:30
# 5) Chain wait lives in a separate job so it cannot block the next scan
# 6) Optional self-chain via SCAN_DISPATCH_TOKEN (see scripts/setup_scan_cron.sh)
# 7) repository_dispatch for external cron-job.org backup
on:
  schedule:
    # 08:30 IST: skip-run that starts the self-chain toward 09:30 (GitHub
    # often never fires the 09:20 warmup cron). Chain job must be allowed
    # to wait ~50 minutes — see timeout-minutes on `chain`.
    - cron: "0 3 * * 1-5"
    # 09:10–09:28 IST extra lottery tickets for the open
    - cron: "40,45,48,50,52,55,58 3 * * 1-5"
    # Dense polls — catch late runners for the current half-hour slot
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0,5,10,15,20,25 10 * * 1-5"
    # Exact half-hour backups (09:30–15:30 IST) plus 15:45 close
    - cron: "0,30 4-9 * * 1-5"
    - cron: "0,15 10 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [oi-scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      chain: ${{ steps.slot.outputs.chain }}
    concurrency:
      group: oi-rsi-scan
      # Do not cancel a running scan. Slot guard skips duplicates instead.
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      # Stdlib only — run before pip so skipped polls cost almost nothing.
      - name: Slot guard
        id: slot
        run: |
          python3 - <<'PY'
          import os
          from src.scan_slots import should_run_slot, seconds_until_next_slot

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          # Manual "Run workflow" always scans; schedules / external pings use the lock.
          force = event == "workflow_dispatch"
          run, reason, slot = should_run_slot(force=force)
          print(reason)
          if slot is not None:
              print(f"slot={slot.isoformat()}")

          chain = seconds_until_next_slot() is not None
          print(f"chain={chain}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if run else 'false'}\n")
              handle.write(f"chain={'true' if chain else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.slot.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Cache key for today
        if: steps.slot.outputs.run == 'true'
        id: today
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore market data cache
        if: steps.slot.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-data-${{ steps.today.outputs.date }}
          restore-keys: |
            market-data-

      - name: Cache status
        if: steps.slot.outputs.run == 'true'
        run: |
          mkdir -p .cache
          TODAY="daily_closes_$(date +%F).json"
          if [ -f ".cache/$TODAY" ]; then
            echo "Using Actions cache: .cache/$TODAY"
          elif [ -f data/daily_closes_seed.json ]; then
            cp data/daily_closes_seed.json ".cache/$TODAY"
            echo "Seeded .cache/$TODAY from data/daily_closes_seed.json"
          else
            echo "No candle cache available — cold start."
          fi
          ls -lah .cache | head -20

      - name: Run scan
        if: steps.slot.outputs.run == 'true'
        timeout-minutes: 12
        run: python -u main.py --once --slot-guard

      - name: Save paper trading ledger
        if: always() && steps.slot.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Ledger unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update paper trading ledger [skip ci]"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push the ledger after 3 attempts."
          exit 1

  # Sleeps until 10 minutes before the next slot, then dispatches. Separate
  # concurrency group so this wait cannot queue (and delay) the next scan.
  chain:
    needs: scan
    if: always() && needs.scan.result != 'cancelled' && needs.scan.outputs.chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: oi-rsi-chain
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch next slot with warmup
        env:
          GH_TOKEN: ${{ secrets.SCAN_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SCAN_DISPATCH_TOKEN not set — chain disabled."
            echo "Run: scripts/setup_scan_cron.sh"
            exit 0
          fi

          WAIT_SECONDS=$(python3 - <<'PY'
          from src.scan_slots import seconds_until_warmup_dispatch
          wait = seconds_until_warmup_dispatch()
          print(0 if wait is None else int(wait))
          PY
          )

          if [ "$WAIT_SECONDS" -le 0 ]; then
            echo "No further IST slots today — chain stop."
            exit 0
          fi

          echo "Waiting ${WAIT_SECONDS}s, then dispatching warmup for the next IST slot..."
          sleep "$WAIT_SECONDS"
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type='oi-scan'
          echo "Dispatched oi-scan warmup for the next slot."

  # Nifty 1H has no cron-job.org ping of its own. GitHub schedule skipped its
  # whole morning on 27 Aug 2026. Reuse this repo's 5-minute cloud kick.
  kick-nifty:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: kick-nifty-1h
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Dispatch nifty-scan
        env:
          GH_TOKEN: ${{ secrets.SCAN_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SCAN_DISPATCH_TOKEN not set — nifty kick skipped."
            exit 0
          fi
          gh api --method POST repos/AbhilashMunnur/nifty-index-trade/dispatches \
            -f event_type='nifty-scan'
          echo "Dispatched nifty-scan."
