name: OI + RSI scan

# GitHub cron is UTC and often late/skipped. Fire every 30 minutes across the
# IST session window; the job exits immediately outside 09:15–15:45 IST.
on:
  schedule:
    - cron: "0,30 3-10 * * 1-5"   # 08:30–16:00 IST, every 30 minutes
  workflow_dispatch:            # lets you trigger a scan by hand

concurrency:
  group: oi-rsi-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write   # the paper trading ledger is committed back
    env:
      TZ: Asia/Kolkata
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache key for today
        id: today
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      # Daily closes and the instrument master only change once a day, so
      # sharing them across runs keeps each scan near a minute instead of two.
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-data-${{ steps.today.outputs.date }}

      - name: Market hours check
        id: market
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          start, end = time(9, 15), time(15, 45)
          open_ = now.weekday() < 5 and start <= now.time() <= end
          print(f"IST {now:%Y-%m-%d %H:%M}  market_open={open_}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"open={'true' if open_ else 'false'}\n")
          PY

      - name: Run scan
        if: steps.market.outputs.open == 'true'
        timeout-minutes: 8
        run: python -u main.py --once

      # Runners are wiped after each job, so the open positions and realised P&L
      # have to be committed or every scan would start from a blank book.
      - name: Save paper trading ledger
        if: always()
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Ledger unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update paper trading ledger [skip ci]"

          # Another scan may have pushed since checkout; rebase and retry.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push the ledger after 3 attempts."
          exit 1
