name: OI + RSI scan

# GitHub's schedule event is often late or skipped. Poll every 15 minutes during
# the IST session; --slot-guard ensures each 09:30 / 10:00 / … / 15:30 slot runs
# exactly once, and a missed tick is picked up by the next poll.
on:
  schedule:
    - cron: "0,15,30,45 4-9 * * 1-5"   # 09:30–15:15 IST every 15 minutes
    - cron: "0,15 10 * * 1-5"          # 15:30 and 15:45 IST
  workflow_dispatch:                   # manual run from the Actions tab
  repository_dispatch:                 # optional external cron (cron-job.org)
    types: [oi-scan]

concurrency:
  group: oi-rsi-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # paper ledger + slot marker committed back
    env:
      TZ: Asia/Kolkata
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache key for today
        id: today
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-data-${{ steps.today.outputs.date }}

      - name: Cache status
        run: |
          if [ -d .cache ]; then
            echo "Cache files:"; ls -lah .cache | head -20
          else
            echo "No .cache directory — cold start (slower)."
          fi

      - name: Slot guard
        id: slot
        run: |
          python - <<'PY'
          import os
          from src.scan_slots import should_run_slot

          # Manual "Run workflow" always scans; scheduled runs use the 30-min slot lock.
          force = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          run, reason, slot = should_run_slot(force=force)
          print(reason)
          if slot is not None:
              print(f"slot={slot.isoformat()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Run scan
        if: steps.slot.outputs.run == 'true'
        timeout-minutes: 25
        run: python -u main.py --once --slot-guard

      - name: Save paper trading ledger
        if: always()
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Ledger unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update paper trading ledger [skip ci]"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push the ledger after 3 attempts."
          exit 1
