name: OI + RSI scan

# Shared GitHub Free 2,000 min/month with nifty-index-trade. Do not poll every
# 5 minutes or sleep on a runner until the next slot. Nifty has its own IST
# 15-minute cron — this workflow must not dispatch nifty-scan.
on:
  schedule:
    # Half-hour slots 09:30–15:00 IST, then 15:15 / 15:30 / 15:45.
    # RSI_CandlePattern entries are from 15:15. Earlier slots mark stops / SMMA.
    - cron: "0,30 4-9 * * 1-5"
    - cron: "45 9 * * 1-5"
    - cron: "0,15 10 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [oi-scan]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: oi-rsi-scan
      # Do not cancel a running scan. Slot guard skips duplicates instead.
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      # Stdlib only — run before pip so skipped polls cost almost nothing.
      - name: Slot guard
        id: slot
        run: |
          python3 - <<'PY'
          import os
          from src.scan_slots import should_run_slot

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          # Manual "Run workflow" always scans; schedules / external pings use the lock.
          force = event == "workflow_dispatch"
          run, reason, slot = should_run_slot(force=force)
          print(reason)
          slot_iso = slot.isoformat() if slot is not None else ""
          if slot_iso:
              print(f"slot={slot_iso}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run={'true' if run else 'false'}\n")
              handle.write(f"slot={slot_iso}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.slot.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Cache key for today
        if: steps.slot.outputs.run == 'true'
        id: today
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore market data cache
        if: steps.slot.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-data-${{ steps.today.outputs.date }}
          restore-keys: |
            market-data-

      - name: Cache status
        if: steps.slot.outputs.run == 'true'
        run: |
          mkdir -p .cache
          TODAY="daily_closes_$(date +%F).json"
          if [ -f ".cache/$TODAY" ]; then
            echo "Using Actions cache: .cache/$TODAY"
          elif [ -f data/daily_closes_seed.json ]; then
            cp data/daily_closes_seed.json ".cache/$TODAY"
            echo "Seeded .cache/$TODAY from data/daily_closes_seed.json"
          else
            echo "No candle cache available — cold start."
          fi
          ls -lah .cache | head -20

      - name: Run scan
        if: steps.slot.outputs.run == 'true'
        timeout-minutes: 18
        run: python -u main.py --once --slot-guard

      - name: Save paper trading ledger
        if: always() && steps.slot.outputs.run == 'true'
        env:
          SLOT_ISO: ${{ steps.slot.outputs.slot }}
        run: |
          # Persist the paid slot even if the books did not move. Without this,
          # a 5-minute external kick re-sends the same half-hour Telegram.
          if [ -n "$SLOT_ISO" ]; then
            printf '%s' "$SLOT_ISO" > data/last_scan_slot.txt
            echo "Slot marker → $SLOT_ISO"
          fi
          echo "Working tree (data):"
          git status --porcelain -- data || true
          cat data/last_scan_slot.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- data/paper_book.json data/rsi_candle_3m_2w_paper_book.json data/last_scan_slot.txt data/paper_trades.csv data/rsi_candle_3m_2w_paper_trades.csv || true
          git add -- data/paper_book.json data/rsi_candle_3m_2w_paper_book.json data/last_scan_slot.txt data/paper_trades.csv data/rsi_candle_3m_2w_paper_trades.csv || true

          if git diff --cached --quiet; then
            echo "Ledger unchanged."
            exit 0
          fi
          git commit -m "Update paper trading ledger [skip ci]"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push the ledger after 3 attempts."
          exit 1
